org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NeoGradle 7 does not support Gradle's configuration cache; leave this off.
org.gradle.configuration-cache=false

# Parchment gives readable parameter names on decompiled Minecraft sources.
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

## Environment - matched to the ATM10 instance this is developed against.
## Instance: D:\Minecraft Instances\All the Mods 10 - ATM10(1)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.234
loader_version_range=[1,)

## Refined Storage. Unlike rstweaks, rsmc mixins into nothing -- it is a content mod that
## registers network nodes through RS's public API -- so this is a compile dependency
## against an interface, not a bytecode-exact match. Still pinned to the 2.0.x line.
refined_storage_version=2.0.9

## Mod Properties
mod_id=rsmc
mod_name=Refined Storage Multiblock Crafter
mod_license=All Rights Reserved
# >> WHEN YOU CHANGE THIS LINE, ADD AN ENTRY TO BOTH VERSIONS.txt AND CHANGELOG.md. <<
# The same rule rstweaks runs on, adopted from the start here rather than after the fact:
# 0.2.18-0.2.46 of that mod were never written down and the detail is unrecoverable.
#
# WHICH DIGIT: the PATCH digit, per build handed over for testing. Not the minor one.
# The first day of this mod ran 0.1.0 -> 0.4.1 in an afternoon by minor-bumping every
# change, which made a scaffold with no working crafter read like a mod four releases in.
# It was renumbered to 0.0.1 while nothing had been published.
#
# The minor digit moves for a milestone only -- 0.1.0 when the crafter actually crafts.
# 1.0.0 when it is feature complete.
mod_version=0.1.2
mod_group_id=com.wraithhawit.rsmc
