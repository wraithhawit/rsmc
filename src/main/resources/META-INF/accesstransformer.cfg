# Slot.x and Slot.y are final in 1.21.1.
#
# The pattern screen moves slots to scroll and to filter: layout() places the slots the search
# matches and pushes the rest off-screen. That is how Refined Storage's Autocrafter Manager does it
# too -- RS ships a Platform.setSlotY helper for exactly this reason -- but RS only ever scrolls
# vertically, so its helper cannot move x, and a filtered list re-flows horizontally as well.
#
# Safe because slot positions are client-side only: clicks travel as slot indices, so nothing the
# server believes depends on where a slot is drawn.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
